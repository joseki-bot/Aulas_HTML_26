<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="./output.css">
</head>


<body class="bg-green-300">

<!--
    sm: CELULAR
    md: TABLET
    xl: PC 
-->

<!--  ===CABEÇARIO===  -->
    <header>
        <div class="bg-green-500 text-center pt-2 pb-2 ">

            <h1 class="bg-fuchsia-600 text-3xl font-bold border-solid border-4 rounded-2xl p-4 ml-12 mr-12
            md:text-5xl md:ml-50 md:mr-50">

                CANTINHO ANIMAL
            </h1>

        </div>
    </header>

    <h2 class="text-2xl text-center sticky top-0 bg-green-500 z-10 p-2
    md: text-3xl">

        Escolha oque você deseja !!!
    </h2>
<!---------------------------------------------------->


<!--  ===PARTE PRINCIPAL===  -->
    <main>
        <div class="flex flex-col mt-5 ml-5 mr-5 gap-10
        md: ml-20 md: mr-20
        xl:grid xl:grid-cols-3">

            <div class="border-4 rounded-4xl bg-green-700 overflow-hidden
                hover:scale-80 hover:bg-green-300 transition duration-300
            md: border-8">

                <h2 class="text-center text-3xl bg-green-400 p-3
                md: text-5xl xl:text-4xl">
                    RAÇÕES
                </h2>

                <hr class="border-2 border-black md:border-4">

                <div class="flex justify-center">
                    <img src="./Imagem/img_Racoes.png" alt="Duas Rações"
                    class="p-5 pt-6 xl: mt-15">
                </div>

            </div> 


            <div class="border-4 rounded-4xl bg-green-700 overflow-hidden
                hover:scale-80 hover:bg-green-300 transition duration-300
            md: border-8 ">

                <h2 class="text-center text-3xl bg-green-400 p-3
                md: text-5xl xl:text-4xl">
                    BRINQUEDOS
                </h2>

                <hr class="border-2 border-black md:border-4">

                <div class="flex justify-center">
                    <img src="./Imagem/img_Brinquedos.png" alt="Duas Rações"
                    class="p-5 pt-6">
                </div>

            </div>


            <div class="border-4 rounded-4xl bg-green-700 overflow-hidden
                hover:scale-80 hover:bg-green-300 transition duration-300
            md: border-8">

                <h2 class="text-center text-3xl bg-green-400 p-3
                md: text-5xl xl:text-4xl">
                    MÉDICAMENTOS
                </h2>

                <hr class="border-2 border-black md:border-4">

                <div class="flex justify-center">
                    <img src="./Imagem/img_Seringa.png" alt="Duas Rações"
                    class="p-5 pt-6">
                </div>

            </div>

        </div>


    </main>
<!-------------------------------------------------->


<!--  ===SETA===  -->
    <a href="#final"
    class="fixed bottom-2 right-2 bg-white rounded-full
    md: bottom-4 right-4">
        
        <img src="./Imagem/img_Seta_Baixo.png" alt="Uma seta apontado para baixo"
        class="w-10 md: w-20">
    </a>

<!---------------------------------------------------->


<!--  ===RODA PÉ===  -->
    <footer class="bg-green-950 w-full text-center text-2xl p-10 mt-10
    xl:p-5">
         <div id="final">
            <h1 class="text-gray-950">
                TODOS OS DIREITOS RESERVADO A <br> José ©
            </h1>
         </div>
    </footer>    
<!--------------------------------------------------->

</body>
</html>
